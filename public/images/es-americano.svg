<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A32"/>
      <stop offset="100%" stop-color="#141E18"/>
    </linearGradient>
    <linearGradient id="coffee_ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2010"/>
      <stop offset="100%" stop-color="#1E0E05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Glass Shadow -->
  <ellipse cx="200" cy="235" rx="55" ry="15" fill="#0C1410" opacity="0.6"/>
  <!-- Glass -->
  <path d="M155 70 L168 220 Q200 230 232 220 L245 70 Z" fill="url(#coffee_ice)"/>
  <ellipse cx="200" cy="70" rx="45" ry="12" fill="#5A351D"/>
  <!-- Ice cubes floating -->
  <rect x="175" y="78" width="26" height="24" rx="4" fill="#FFFFFF" opacity="0.6" transform="rotate(8 175 78)"/>
  <rect x="205" y="85" width="22" height="20" rx="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-12 205 85)"/>
  <!-- Text Label -->
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E8DBCB" text-anchor="middle" letter-spacing="1">COLD BREW &amp; ICED</text>
</svg>
