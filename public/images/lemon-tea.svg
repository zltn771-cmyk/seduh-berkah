  <rect x="180" y="90" width="26" height="24" rx="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-10 180 90)"/>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E8DBCB" text-anchor="middle" letter-spacing="1">FRESH CITRUS JASMINE</text>
