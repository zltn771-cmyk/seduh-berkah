<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2F1B"/>
      <stop offset="100%" stop-color="#24140A"/>
    </linearGradient>
    <linearGradient id="layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE1"/>
      <stop offset="40%" stop-color="#C29B78"/>
      <stop offset="70%" stop-color="#6F411C"/>
      <stop offset="100%" stop-color="#401F08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Glass Shadow -->
  <ellipse cx="200" cy="235" rx="55" ry="15" fill="#140B06" opacity="0.6"/>
  <!-- High Glass -->
  <path d="M155 70 L168 220 Q200 230 232 220 L245 70 Z" fill="url(#layer)"/>
  <!-- Ice Cubes -->
  <rect x="180" y="85" width="28" height="24" rx="4" fill="#FFFFFF" opacity="0.6" transform="rotate(12 180 85)"/>
  <rect x="195" y="125" width="24" height="22" rx="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 195 125)"/>
  <!-- Straw -->
  <line x1="215" y1="40" x2="185" y2="200" stroke="#2D5A43" stroke-width="6" stroke-linecap="round"/>
  <!-- Text Label -->
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E8DBCB" text-anchor="middle" letter-spacing="1">GULA AREN CURUP</text>
</svg>
